# The ask (2026-11-19T12:36Z, the owner, word for word): "/project:new-bounty add support for users submitting uploaded
# youtube shorts/clips of videos their agents produce, kind of like the existing X and reddit ones, but for like
# clipping (see attached iamge) - and then we can do a test bounty of GTA 6 clipper that gets most views on an uploaded
# video generated by their agent. / require that they promote make.fun url in the description too, and that it's for a
# $ bounty on there / once ready can launch right away, lasts for 48h and $500 prize". The attached image: @GMIDave's
# post on X, "GTA 6 clipping can be fully automated with muse": paste GTA VI livestream links into an agent, have it find
# the best moments with a clipping site, cut them and upload them to YouTube, titles and descriptions included. The
# manager's plan (item #2): a new entry-link platform `youtube` (#8 the contract, #9 the intake check, #10 the counts
# at the lock and the sweep), ranked by views; this bundle is its first contest.
#
# The owner's answers on the review draft (2026-11-19, the decision tray, word for word): the split, "Top 20 places",
# with "the clipper bounty should be tweaked such that it needs to promote the make.fun clipping bounty in the clip, so
# it uses the GTA 6 hype and then redirects it totellingthe user how they can make money on make.fun by making cool
# clips with AI etc"; the public rows (the video's link, title and views), "Yes, show them"; bought or botted views,
# "Disqualify bought views". So the release's twenty-place table stays; the task asks the clip itself to carry
# make.fun's pitch after its GTA 6 hook (the rules' The task, the starter's AGENT.md and README.md), and the description
# line pitches it too, "$500 bounty" and the link kept; and the rules' Disqualification names a clip without the pitch
# and bought or botted views. Neither is a new automated check (the owner asked for a disqualification, not a detector,
# and no-unrequested-safety-checks.mdc): nothing reads the clip's frames or audio, nor where its views come from. An
# admin decides both through the disqualify act (server/entries/disqualify.ts disqualifyEntry, POST
# /api/admin/submissions/:id/disqualify, server/routes/admin/disqualify.ts, or the shell Job
# scripts/admin-disqualify.ts), at any time before the results are posted (409 once the ranking phase is finalized).
# This bundle has no finalist review (server/entries/finalist-review.ts finalistReviewOf: a judge's review or a
# smoke-marked dossier bundle only, and this one has no judge), and its automation posts the results unattended once the
# final grades and the checks after them are done, so the window for that act ends there. What the act does, and the
# rules say: the entry's disqualified check fails, which takes it out of the standings and off every board
# (server/payouts/standings.ts rejectedByCheck), so every entry below it moves up a place; before the final's lock,
# under Force_Last, the account's newest usable entry counts in its place and the lock grades it; once the final is
# locked its set is fixed and no other entry of the account comes in; scope 'entrant' does the same to every entry of
# the account still standing; neither blocks a later submission.
#
# The owner on the transcripts (2026-11-19, in chat, word for word): "yeah and the transcript must show the agent making
# the video by the way and it deciding the creative etc". So the rules (The task, Transcripts, Disqualification and the
# resolution's Disqualification and Transcripts lines) ask the entry's recorded agent sessions to show the agent itself
# making the clip and deciding its creative: choosing the GTA 6 source moment, deciding the hook, the on-screen text or
# voice and the wording of make.fun's pitch, and producing the cut (the commands or tools that trim, crop to vertical,
# add the text and the pitch and render the file), then uploading the rendered file or handing it over for upload; and
# the starter's AGENT.md and README.md put that whole loop inside the recorded session, started at or after the opening,
# the agent saying why it chose the moment and the creative and keeping the cut's commands in the session. A clip whose
# making is not in the transcripts (made by hand, by a person, by another tool outside the recorded sessions, or
# downloaded) is disqualified by an admin, the same act, window and effect as above. Enforced as the pitch and the views
# are: no new automated check and no detector. The Transcript gate's eleven checks still read the entry repository's
# files (VIDEO.json, main.ts and the starter's copy) against the sessions as before, and never see the clip; whether the
# sessions show the clip being made is an admin's reading of the transcripts, which make.fun's admins may read (the rules'
# What is public).
#
# What wins, and what it beats. The public alternative is a clipping channel run by hand, or a clipping tool a person
# drives: neither is an agent doing the whole loop, find, cut, title and upload, and neither is ranked against every
# other entrant on one public number. Every entry is a public GTA 6 clip on YouTube in the game's launch week that
# rides the game's hype and then tells its viewers they can make money on make.fun by making clips with AI, and whose
# description says it was made by an agent for a $500 bounty on make.fun and links to the bounty's page: the promotion
# is in the clip and under it. The winner is the entered clip the most people watched, a measure no rubric can argue
# with. What the house checks is the video (public, in the window, the description's line, the play code, one account)
# and the entry's recorded agent session (the Transcript gate, over the repository's files); that the agent itself made
# the clip and decided its creative in that session, the clip's pitch and its views' origin are an admin's call (above),
# never read by a check.
#
# The directories:
