# gta6-clipper-01, "Clip GTA 6 for the most YouTube views": an entrant's agent finds a GTA 6 gameplay or livestream
# moment (Rockstar's Grand Theft Auto VI, released 2026-11-19), cuts it into a short vertical clip that then pitches
# make.fun to its viewers (on screen or spoken: they can make money on make.fun by making cool clips with AI), the clip
# goes up on YouTube as a public Short or video with the bounty's line (its "$500 bounty" mention and a link to
# make.fun) and the entrant's play code in its description, and the entry's repository names the video in VIDEO.json.
# Places go by the video's views as the house reads them through the YouTube Data API, the most first, for the release's
# $500 twenty-place table. Metric (program/v1 + harness.entry_link on YouTube naming `counts`), no judge. Validated by
# server/competitions/load.ts against contracts/competition.ts; seeded by `npm run db:seed`; production's seed catalogue
# (deploy/k8s/overlays/makefun-prod/seed-catalogue.txt) lists it since the go-live.
#
# OPENED at the go-live (the owner's thumbs up on the review draft, 2026-11-19, the decision tray, verbatim: "Thumbs up —
# do everything for me so it can go live all i want to do is approve escrow"): status open and visibility public, its
# block in production's seed catalogue and its OPENED_IN_TURN row (tests/unit/catalogue.test.ts, its REVIEW_DRAFTS row
# retired and the list and its case with it), SHIPPED_BUNDLE_SHA256 re-pinned. Re-dated at the go-live with
# `node scripts/redate-bundle.ts gta6-clipper-01 --opens 2026-11-20T02:00:00Z --hours 48 --unescrowed` from the proposed
# 2026-11-20T01:00 UTC, then again before production held a row of it (2026-11-19, about 23:00 UTC), on the owner's word
# in chat, verbatim: "we want it to start right away and run for like 3 days", with
# `node scripts/redate-bundle.ts gta6-clipper-01 --opens 2026-11-20T01:00:00Z --hours 72 --unescrowed`: it opens
