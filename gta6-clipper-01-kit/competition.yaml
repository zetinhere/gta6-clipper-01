# main.ts unchanged are discounted by the base. The lock's write measured 81.9 s at 20,000 (392 UPDATEs, 208.8 ms mean),
# in one transaction as readAndWrite's 'deadline' writes the field at this commit; item #40 writes it in short per-chunk
