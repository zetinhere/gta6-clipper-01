#   scorer/score.ts         the sealed scorer (harness.gate: valid, runtime node22, standard library only). It reads
#                           /output/VIDEO.json, /output/video.counts.json and /reference/gate.json, writes exactly the two
#                           scored columns, views and valid (grader/program-scores.ts), and one checks.json row a check:
#                           video_file (a JSON object of at most 16,384 bytes), video_url (its url a video's address on
#                           YouTube exactly as server/entry-link/youtube.ts parseYoutubeVideoUrl reads one, mirrored:
#                           youtube.com/shorts/<id>, youtube.com/watch?v=<id> on youtube.com, www. or m., or
#                           youtu.be/<id>, the id 11 of [A-Za-z0-9_-]) and video_counts (the house's counts file present
#                           and exactly contracts/entry-link-counts.ts EntryLinkCounts, mirrored with the standard
#                           library, a gone reading's counts all null, its video_id VIDEO.json's and its video
#                           'public'). views is the file's views when the entry is valid, else 0 (0 too where YouTube
#                           showed none).
#   reference/gate.json     the gate's limits: VIDEO.json's byte cap (16384, youtube.ts YOUTUBE_LINK_FILE_MAX_BYTES), the
#                           url's length (2048, readYoutubeLinkFile's and EntryLinkCounts' cap) and the counts file's byte
#                           cap (4096, contracts/entry-link-counts.ts ENTRY_LINK_COUNTS_MAX_BYTES). A malformed file is
#                           the bundle's fault: the scorer exits 1.
#   starter/                a working entry laid out as an entrant's repository: main.ts copying VIDEO.json to /output,
#                           VIDEO.json holding the placeholder {"url": "https://www.youtube.com/shorts/<id>"} (no video's
#                           address, so the gate refuses it: a starter that passed would need no video), an MIT LICENSE,
#                           README.md for the person and AGENT.md for the agent; both say to start the session at or after
#                           the opening (thinking_in_window), give the description line, ask for the make.fun pitch in
#                           the clip (a suggested shape: the GTA 6 hook, then the pitch and its call to action), ask for
#                           a public video, say a Short is fine and that bought or botted views disqualify, and put the
#                           whole loop in the recorded session (find the moment, decide the creative and say why, cut
#                           and render it there, then upload or hand it over), as the transcripts must show it.
#
# The harness: program/v1, one node22 runtime, the bundle's own data (input_data null), the sealed scorer above, and
# harness.entry_link {file: VIDEO.json, platform: youtube, mention: "$500 bounty", link: make.fun, binding: {code: true,
# one_account: true}, engagement: true, counts: video.counts.json} (contracts/competition.ts ProgramEntryLink, platform
# youtube; server/entry-link/youtube.ts). The house reads VIDEO.json from the entry's snapshot at intake, reads the video
# through the YouTube Data API v3 (videos.list, 1 quota unit; channels.list, 1 more, only when the play code is not in
# the video's own description) and refuses an entry whose video is gone (private, deleted, never posted), is not public
# (unlisted), was published outside [opens_at, deadline], whose DESCRIPTION does not carry "$500 bounty" (any case, a
# whole word at its end) or make.fun (linked or written out: x.ts postLinkFoundOf), whose description and channel
# description both lack one of the entrant's play codes, or whose video an earlier entry of another account named
# (one_account). Nothing else is checked: no length, live-stream, view-count, anti-bot or clip-content check (the plan's
# scope, ~/.cosmos/rules/no-unrequested-safety-checks.mdc); the clip's make.fun pitch, bought or botted views and a clip
# whose making the transcripts do not show are the rules' Disqualification, an admin's act (the owner's answers above). The description line the copy asks entrants to
# paste, "Made by my AI agent for a $500 bounty on make.fun, where you can earn money making clips with AI:
# https://make.fun/bounty/gta6-clipper-01", carries both the mention and the link (the owner's "promote make.fun url in
# the description too, and that it's for a $ bounty on there"; youtube.ts youtubeLinkFoundOf reads it linked, x.ts
# xTextCarries finds "$500 bounty", run on this line 2026-11-19) and the pitch's money-making angle. After the entry's
# two runs and before the scorer the grader writes the house's counts at /output/video.counts.json (grader/program.ts
# houseCountsOutputs, makefun/video-counts/v1), replacing what the entry wrote there: a dev grade the reading the intake
# check took (reading 'check'), a final grade the reading the final's lock took (reading 'deadline'). The program's own
# output never reaches the score, so main.ts is a copy of VIDEO.json and no more.
#
# The views. Three readings, each on the entry's record (server/entry-link/youtube-readings.ts): the intake check's (the
# dev grade's counts file); the latest, which the 15-minute sweep (server/grading/provisional-rejudge-sweep.ts
# readYoutubeLatest) takes again for each read video while the dev window is open, once its last is older than
# youtubeLatestIntervalMs (15 minutes, or longer where half the key's daily quota cannot read the whole field that
# often), and the dev board ranks on with no regrade (server/routes/competitions/leaderboard.ts withLatestViews: a gone
# reading counts 0); and the lock's, one batched pass over every frozen final entry's video inside lockPhase
# (server/competitions/lifecycle/finalize.ts), before any final grade is sent, which the final grade's counts file
# carries. A final grade whose reading is not yet in (a faulted pass, a late joiner) waits for it inside the final
# window (grader/worker.ts countsHandOn), never graded on another, and the sweep reads what is owed. A video gone or no
# longer public at the lock reads `video: 'gone'`: the scorer marks it invalid, so it takes no place. A record never
# read (the intake lookup faulted on its last attempt) is HouseCountsFault, the house's, never scored as the entrant's.
# The dev board is a live, unofficial projection; the places are the lock's reading alone.
#
# The quota (MAKEFUN_YOUTUBE_QUOTA_UNITS_PER_DAY, default 10,000, Google's default project quota passed through, not a
# house cap): a call reads up to 50 videos for 1 unit. Half goes to the latest sweep: at 2,000 entries one pass is 40
# calls and every video is read every 15 minutes (3,840 units a day); at 20,000 a pass is 400 calls, so a video is read
# about every 115 minutes. The lock's pass at 2,000 entries is 40 calls; intake checks are 1 or 2 units an entry.
# MAKEFUN_YOUTUBE_API_KEY must be set on the cluster (Secret makefun-env) before the opening: without it every intake
# check faults (YoutubeUnavailableError) and records a skip with the video unread, and every grade of such an entry
# is held as the house's fault (HouseCountsFault), never scored as the entrant's.
#
